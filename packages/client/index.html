      <h1>Survive and Conquer</h1>
      <p>Survive and Conquer is a free co-op survival strategy game that runs in your browser. By day you gather wood, stone and food, raise buildings, research and train an army. By night monsters pour out of the dark and their lairs, and the nights never end: each one is harder than the last.</p>
      <p>Play alone or with up to 8 friends in an online lobby, and save your village to come back to. The game needs JavaScript and WebGL to run.</p>
