      <h1>Survive and Conquer</h1>
      <p>Survive and Conquer is a co-op survival open world real-time strategy game you play in your browser. Gather wood, stone and food, craft gear, raise a base and train your people, then push out into wild lands that grow more dangerous the farther you go. When night falls, monsters come for your walls, and every night brings stronger ones. The nights never end: play alone or with up to 7 friends and see how long you last.</p>
      <p>It needs JavaScript and WebGL to run.</p>
