name: CI

# Every run: lint, typecheck, all Vitest tests except the cross-browser one,
# the headless runner, the builds, the two-player network test and the server
# image. The cross-browser determinism test (Playwright's Chromium, Firefox
# and WebKit, the longest part) runs too on pushes to main, on pull requests
# that are not drafts (so marking a draft ready for review runs it), and when
# the workflow is run by hand on a branch. Pushes that change only notes and
# docs skip CI; docs/blueprint.md and anything under packages/ still run it,
# since tests read them. README.md "Continuous integration" has the details.

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**/*.md'
      - 'docs/blueprint.md'
      - 'packages/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**'
      - '!**/*.md'
      - 'docs/blueprint.md'
      - 'packages/**'
  workflow_dispatch:

# A new push to a branch or pull request cancels the run its last push started.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # true: also run the cross-browser determinism test (not on draft pull requests).
      BROWSER_CHECK: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
      # The server's database and save-store tests, and the two-player network test, use these.
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/blockyrts_test
      TEST_S3_ENDPOINT: http://localhost:9000
      TEST_S3_BUCKET: saves
      TEST_S3_ACCESS_KEY_ID: s3test
      TEST_S3_SECRET_ACCESS_KEY: s3test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: blockyrts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Start S3Mock (S3-compatible save storage)
        # MinIO no longer publishes images on Docker Hub; S3Mock accepts any key pair and serves path-style buckets.
        run: |
          docker run -d --name s3 -p 9000:9090 -e COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS=saves adobe/s3mock:5.2.3
          for _ in $(seq 60); do curl -fs -o /dev/null http://localhost:9000/ && break; sleep 1; done
          curl -s -o /dev/null -X PUT http://localhost:9000/saves
          curl -fsI http://localhost:9000/saves
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # The runner has two cores; Vitest's default (cores - 1) would run one test file at a time.
      - name: Tests (all but the cross-browser test)
        run: pnpm test --maxWorkers=2 --exclude packages/tools/test/cross-browser.test.ts
      # Mostly apt packages for the three engines; the browser downloads are about 15 s, so not cached.
      - name: Install Playwright browsers
        if: env.BROWSER_CHECK == 'true'
        run: pnpm --filter @blockyrts/tools exec playwright install --with-deps chromium firefox webkit
      - name: Cross-browser determinism test (Node, Chromium, Firefox, WebKit)
        if: env.BROWSER_CHECK == 'true'
        run: pnpm test packages/tools/test/cross-browser.test.ts
        env:
          # Fails, rather than skips, if one of these is missing.
          SIM_REQUIRE_BROWSERS: chromium,firefox,webkit
      - name: Headless runner, M0 check script
        run: pnpm sim:run --seed 1 --steps 10000 --orders packages/tools/orders/m0-demo.json --quiet
      - name: Client build
        run: pnpm --filter @blockyrts/client build
      - name: Audio audition page build
        run: pnpm --filter @blockyrts/audio build
      - name: Balance editor build
        run: pnpm --filter @blockyrts/balance build
      - name: Two-player network test (built-in server, PostgreSQL, S3Mock)
        run: pnpm --filter @blockyrts/tools net:test
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          SAVE_STORE: s3
          S3_ENDPOINT: ${{ env.TEST_S3_ENDPOINT }}
          S3_BUCKET: saves
          S3_REGION: us-east-1
          S3_ACCESS_KEY_ID: s3test
          S3_SECRET_ACCESS_KEY: s3test
      - name: Server image builds, migrates the database and answers /healthz
        run: |
          docker build -f packages/server/Dockerfile --build-arg "BUILD_SHA=$GITHUB_SHA" -t blockyrts-server .
          docker run -d --name server --network host -e PORT=8080 -e DATABASE_URL="$TEST_DATABASE_URL" \
            -e SAVE_STORE=s3 -e S3_ENDPOINT="$TEST_S3_ENDPOINT" -e S3_BUCKET=saves -e S3_REGION=us-east-1 \
            -e S3_ACCESS_KEY_ID=s3test -e S3_SECRET_ACCESS_KEY=s3test -e EMAIL_API_KEY= -e TRUSTED_PROXY=cloudflare \
            blockyrts-server
          for _ in $(seq 30); do
            if curl -fs http://localhost:8080/healthz | grep -q "$GITHUB_SHA"; then docker logs server; exit 0; fi
            sleep 1
          done
          docker logs server
          exit 1
