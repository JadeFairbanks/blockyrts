name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The cross-engine determinism test fails, rather than skips, if one of these is missing.
      SIM_REQUIRE_BROWSERS: chromium,firefox,webkit
      # The server's database and save-store tests, and the two-player network test, use these.
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/blockyrts_test
      TEST_S3_ENDPOINT: http://localhost:9000
      TEST_S3_BUCKET: saves
      TEST_S3_ACCESS_KEY_ID: minioadmin
      TEST_S3_SECRET_ACCESS_KEY: minioadmin
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: blockyrts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Start MinIO (S3-compatible save storage)
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for _ in $(seq 30); do curl -fs http://localhost:9000/minio/health/live && break; sleep 1; done
          docker run --rm --network host --entrypoint sh minio/mc:RELEASE.2025-04-16T18-13-26Z \
            -c "mc alias set local http://localhost:9000 minioadmin minioadmin && mc mb --ignore-existing local/saves"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --filter @blockyrts/tools exec playwright install --with-deps chromium firefox webkit
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Headless runner, M0 check script
        run: pnpm sim:run --seed 1 --steps 10000 --orders packages/tools/orders/m0-demo.json --quiet
      - name: Client build
        run: pnpm --filter @blockyrts/client build
      - name: Audio audition page build
        run: pnpm --filter @blockyrts/audio build
      - name: Two-player network test (built-in server, PostgreSQL, MinIO)
        run: pnpm --filter @blockyrts/tools net:test
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          SAVE_STORE: s3
          S3_ENDPOINT: ${{ env.TEST_S3_ENDPOINT }}
          S3_BUCKET: saves
          S3_REGION: us-east-1
          S3_ACCESS_KEY_ID: minioadmin
          S3_SECRET_ACCESS_KEY: minioadmin
      - name: Server image builds, migrates the database and answers /healthz
        run: |
          docker build -f packages/server/Dockerfile --build-arg "BUILD_SHA=$GITHUB_SHA" -t blockyrts-server .
          docker run -d --name server --network host -e PORT=8080 -e DATABASE_URL="$TEST_DATABASE_URL" \
            -e SAVE_STORE=s3 -e S3_ENDPOINT="$TEST_S3_ENDPOINT" -e S3_BUCKET=saves -e S3_REGION=us-east-1 \
            -e S3_ACCESS_KEY_ID=minioadmin -e S3_SECRET_ACCESS_KEY=minioadmin -e EMAIL_API_KEY= -e TRUSTED_PROXY=cloudflare \
            blockyrts-server
          for _ in $(seq 30); do
            if curl -fs http://localhost:8080/healthz | grep -q "$GITHUB_SHA"; then docker logs server; exit 0; fi
            sleep 1
          done
          docker logs server
          exit 1
