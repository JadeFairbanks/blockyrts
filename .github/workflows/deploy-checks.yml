name: Deploy checks

# Lints the deploy files on pull requests that touch them. Talks to no
# cloud service.

on:
  pull_request:
    paths:
      - deploy/**
      - .github/workflows/**

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: actionlint
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
      - name: shellcheck
        run: shellcheck deploy/scripts/*.sh deploy/droplet/*.sh
      - name: Compose file is valid
        run: |
          env DB_PASSWORD=x SESSION_SECRET=x REGISTRY=r/blockyrts S3_ENDPOINT=https://e S3_BUCKET=b \
            S3_ACCESS_KEY_ID=a S3_SECRET_ACCESS_KEY=s EMAIL_API_KEY=k EMAIL_FROM=f DOMAIN=example.com \
            TUNNEL_TOKEN=t docker compose -f deploy/compose.yml config --quiet
      - name: Cloud-init renders
        run: |
          python3 -m pip install --quiet pyyaml
          env DOMAIN=example.com REGISTRY=r/blockyrts TUNNEL_TOKEN=t S3_ENDPOINT=https://e S3_BUCKET=b \
            S3_ACCESS_KEY_ID=a S3_SECRET_ACCESS_KEY=s EMAIL_API_KEY=k EMAIL_FROM=f \
            REGISTRY_DOCKER_CONFIG='{"auths":{}}' python3 deploy/scripts/render-cloud-init.py \
            | python3 -c 'import sys, yaml; yaml.safe_load(sys.stdin)'
      - name: Bundle image builds
        run: docker build -f deploy/bundle.Dockerfile deploy
      - name: Pages middleware builds
        working-directory: deploy/pages
        run: npx --yes wrangler@4 pages functions build --outdir "$RUNNER_TEMP/pages-functions"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # No pnpm in this job; the version script needs only Node.
          package-manager-cache: false
      - name: Game version works out
        run: node deploy/scripts/game-version-cli.ts
