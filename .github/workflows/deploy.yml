name: Deploy

# Ships the current main (or the branch picked when running it) to the test
# server. Run by hand only, so the server never changes in the middle of a
# game just because a milestone merged. Needs "Set up test server" first.

on:
  workflow_dispatch:
    inputs:
      hotfix:
        description: Hotfix (keep the live version number, add no tag)
        type: boolean
        default: false

concurrency:
  group: test-server-deploy
  cancel-in-progress: false

permissions:
  # write: to tag the deployed commit live-<version>.
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOMAIN: ${{ vars.DOMAIN }}
    steps:
      - uses: actions/checkout@v5
      - name: Check the server can be built
        run: |
          if [ -z "$DOMAIN" ]; then
            echo "::error::The DOMAIN repository variable is not set (see deploy/README.md)."
            exit 1
          fi
          if [ ! -f packages/server/Dockerfile ]; then
            echo "::error::packages/server/Dockerfile does not exist yet; it arrives with the M9 server work."
            exit 1
          fi
      - name: Check the site password is set
        run: |
          # The password the browser's sign-in box asks for (deploy/README.md).
          if [[ -z "${SITE_PASSWORD//[[:space:]]/}" ]]; then
            echo "::error::The SITE_PASSWORD secret is missing or blank; add it in Settings > Secrets and variables > Actions (see deploy/README.md)."
            exit 1
          fi
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD || secrets.SITE_LOGIN_HASH }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Work out the game version
        id: version
        run: |
          git fetch --force --tags --quiet origin
          node deploy/scripts/game-version-cli.ts | tee -a "$GITHUB_OUTPUT"
        env:
          HOTFIX: ${{ inputs.hotfix }}
      - name: Build the game client
        run: pnpm --filter @blockyrts/client build
        env:
          VITE_SERVER_URL: https://api.${{ vars.DOMAIN }}
          VITE_SITE_URL: https://play.${{ vars.DOMAIN }}
          VITE_GAME_VERSION: ${{ steps.version.outputs.label }}
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}
      - name: Build and push the server and the bundle
        run: |
          name=$(doctl registry get --format Name --no-header)
          registry="registry.digitalocean.com/$name/blockyrts"
          doctl registry login --expiry-seconds 1200
          docker build -f packages/server/Dockerfile --build-arg "BUILD_SHA=$GITHUB_SHA" \
            -t "$registry:server-live" .
          docker push "$registry:server-live"
          docker build -f deploy/bundle.Dockerfile -t "$registry:bundle-live" deploy
          docker push "$registry:bundle-live"
          # The free registry tier holds 500 MB; drop the old, now untagged images.
          doctl registry garbage-collection start --include-untagged-manifests --force \
            || echo "Garbage collection not started (one may already be running)."
      - name: Wait for the server to run this commit
        run: |
          # The Droplet checks the registry every minute.
          for _ in $(seq 60); do
            if curl -fsS --max-time 10 "https://api.$DOMAIN/healthz" | grep -q "$GITHUB_SHA"; then
              echo "Server is up on $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "::error::https://api.$DOMAIN/healthz did not report $GITHUB_SHA within 10 minutes."
          exit 1
      - name: Publish the game client
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            # Not secret; when it was not saved, ask Cloudflare (as setup does).
            CLOUDFLARE_ACCOUNT_ID=$(curl -fsS "https://api.cloudflare.com/client/v4/zones?name=$DOMAIN" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '.result[0].account.id')
            export CLOUDFLARE_ACCOUNT_ID
          fi
          # The sign-in box (deploy/pages): the middleware in deploy/pages/functions,
          # _routes.json so the game's files skip it, and _headers. The password
          # goes to the Pages project as a secret before the deploy, which is
          # when Pages reads it.
          cp deploy/pages/static/_routes.json deploy/pages/static/_headers packages/client/dist/
          cd deploy/pages
          printf '%s' "$SITE_PASSWORD" | pnpm dlx wrangler@4 pages secret put SITE_PASSWORD --project-name blockyrts
          pnpm dlx wrangler@4 pages deploy ../../packages/client/dist \
            --project-name blockyrts --branch main --commit-hash "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD || secrets.SITE_LOGIN_HASH }}
      - name: Tag the live commit
        if: steps.version.outputs.fresh == 'true'
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
        env:
          TAG: ${{ steps.version.outputs.tag }}
      - name: Summary
        run: |
          {
            echo "## Deployed $GITHUB_SHA as $LABEL"
            echo
            echo "Play at https://play.$DOMAIN"
          } >>"$GITHUB_STEP_SUMMARY"
        env:
          LABEL: ${{ steps.version.outputs.label }}
